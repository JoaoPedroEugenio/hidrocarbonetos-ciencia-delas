<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="codigo.js" defer></script>
    <title>Jogo da Velha</title>
</head>
    <body>
        <main class="jogo">
            <section class="placar">
                <div class="placar__titulo">
                    <h1>Jogo da Velha</h1>
                </div>
                <div class="placar__pontos">
                    <div class="ponto ponto--x">
                        <span>Jogador X</span>
                        <h2 id="pontosX">X: 0</h2>
                    </div>
                    <div class="ponto ponto--o">
                        <span>Jogador O</span>
                        <h2 id="pontosO">O: 0</h2>
                    </div>
                </div>
            </section>

            <section class="partida">
                <div class="status">
                    <p id="vez">Vez do X</p>
                    <p id="resultado">Boa partida!</p>
                </div>

                <div class="tabuleiro">
                    <div class="linha">
                        <button class="botao"></button>
                        <button class="botao"></button>
                        <button class="botao"></button>
                    </div>
                    <div class="linha">
                        <button class="botao"></button>
                        <button class="botao"></button>
                        <button class="botao"></button>
                    </div>
                    <div class="linha">
                        <button class="botao"></button>
                        <button class="botao"></button>
                        <button class="botao"></button>
                    </div>
                </div>

                <button id="reiniciar">Reiniciar partida</button>
            </section>
        </main>
    </body>
</html>
